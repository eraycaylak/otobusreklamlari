# ---------------------------------------------------------------------------
# Toplanma noktasi onbellek kutusu - nginx yapilandirmasi
#
# Mimarinin kalbi burasi: reklam dosyasi TEK internet hattindan gunde BIR KEZ
# geciyor (rsync ile, saatler once), 3 dakikalik pencerede 20 otobuse LAN
# hizinda dagitiliyor. Boylece internet hattinin hizi neredeyse onemsizlesiyor.
#
# /etc/nginx/sites-available/reklam olarak kurun, MERKEZ adresini degistirin.
# ---------------------------------------------------------------------------

upstream merkez {
    server 10.0.0.5:8080;          # <-- MERKEZ SUNUCU ADRESI
    keepalive 8;
}

# Manifest onbellegi: PtMP linki koptugunda BAYAT manifest servis edilebilsin
proxy_cache_path /var/cache/nginx/reklam levels=1:2 keys_zone=manifest:10m
                 max_size=100m inactive=30d use_temp_path=off;

server {
    listen 80 default_server;
    server_name _;

    # ---------------------------------------------------------------------
    # GIZLI DOSYALAR SERVIS EDILMEZ.
    #
    # ayna.sh rsync'i --partial-dir=.rsync-partial ile calistiriyor: yarim inen
    # dosyalar gizli bir dizinde tutuluyor, nihai adiyla ORTAYA KONMUYOR. Yine de
    # o dizini acikca kapatiyoruz - yarim bir dosyanin servis edilmesi, otobusun
    # tam dosya hash'inde patlayip 3 dakikalik pencereyi bosa harcamasi demektir.
    # ---------------------------------------------------------------------
    location ~ /\. { deny all; access_log off; log_not_found off; }

    access_log /var/log/nginx/reklam-access.log;
    error_log  /var/log/nginx/reklam-error.log warn;

    # 20 otobus ayni anda baglanabilir
    keepalive_timeout 30s;
    client_max_body_size 64m;

    # -----------------------------------------------------------------------
    # ICERIK: tamamen yerel. PtMP linki kopuk olsa bile calisir.
    #
    # Range/206 destegi nginx'te VARSAYILAN olarak aciktir ve bu sistemin
    # temelidir: otobus pencereyi kacirdiginda kaldigi bayttan devam eder.
    # `max_ranges` veya `proxy_force_ranges` ile OYNAMAYIN.
    #
    # ERISIM SINIRI - DURUST NOT:
    # Bu iki yol dosyalari YEREL AYNADAN (rsync) servis ediyor, merkeze
    # sormuyor. Dolayisiyla merkez sunucuda /content ve /app icin acilan cihaz
    # tokeni zorunlulugu BURAYA UYGULANAMAZ: kutunun tokeni dogrulamasi icin
    # merkeze sormasi gerekirdi, ki tam da PtMP linki koptugunda calismaz -
    # yani mimarinin varlik sebebini iptal ederdi.
    #
    # Sinir bu yuzden AG KATMANINDA: yalnizca noktanin kendi alt agi cevap alir.
    # Pratikte bu, "AP'nin WPA2 anahtarini bilen okuyabilir" demektir. Kabul
    # edilebilir, cunku:
    #   - reklam videolari zaten halka acik otobus ekranlarinda yayinlaniyor
    #   - APK'daki PROVISION_SECRET TEK BASINA filoya giris vermez: provizyon
    #     ayrica panelden uretilmis bir CIHAZ TOKENI ister ve o sir sadece
    #     fiziksel adb erisimiyle yapilan yerel yayini korur
    # Merkez sunucuda ise auth ACIK kaliyor: internete donuk taraf budur.
    # -----------------------------------------------------------------------
    location /content/ {
        root /srv/reklam;

        # <-- NOKTANIN ALT AGI. Kendi aginiza gore duzeltin.
        allow 10.20.0.0/24;
        allow 127.0.0.1;
        deny all;

        add_header Accept-Ranges bytes always;
        # Dosya adlari icerik adresli (sha256) -> icerik asla degismez
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location /app/ {
        root /srv/reklam;

        # APK ayni sinira tabi. AYNADA TUTULUYOR (merkeze proxy DEGIL) cunku
        # "duzeltilmis surumu yayinla" (fix-forward) tek gercek kurtarma yolu ve
        # tam da PtMP linki kopukken calismasi gerekir.
        allow 10.20.0.0/24;
        allow 127.0.0.1;
        deny all;

        add_header Accept-Ranges bytes always;
        expires 365d;
    }

    # -----------------------------------------------------------------------
    # MANIFEST: merkezden gelir ama ONBELLEKLENIR.
    #
    # proxy_cache_use_stale sayesinde PtMP linki koptugunda son bilinen manifest
    # servis edilir. Bu GUVENLIDIR cunku manifest Ed25519 ile imzalidir - kutu
    # icerigini degistiremez - ve bitis tarihleri manifestin icinde gomulu
    # oldugu icin bayat manifest bile suresi dolmus reklami dirilmez.
    #
    # Onbellek anahtari Authorization basligini icerir: her cihaz kendi
    # manifestini alir, baska cihazinkini GORMEZ.
    # -----------------------------------------------------------------------
    location = /api/v1/manifest {
        proxy_pass http://merkez;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_set_header Authorization $http_authorization;

        proxy_cache manifest;
        # Anahtar Authorization'i ICERIR: manifest cihaza ozeldir (kendi itemlari,
        # kendi rollout grubu). Ortak anahtar, bir otobusun manifestini digerine
        # servis etmek olurdu.
        proxy_cache_key "$http_authorization$request_uri";

        # -------------------------------------------------------------------
        # BU SATIR OLMADAN ONBELLEK HIC DOLMUYOR.
        #
        # Merkez, manifeste bilincli olarak `Cache-Control: no-store` koyuyor:
        # CIHAZIN onu onbelleklememesi gerekiyor (bitis tarihleri taze olmali).
        # Ama nginx de varsayilan olarak bu basligi dinler ve yaniti onbellege
        # ALMAZ. Sonuc: proxy_cache_use_stale'in servis edecegi hicbir kopya
        # olmaz, yani "PtMP koptugunda bayat manifest servis edilir" diye
        # belgelenen dayaniklilik PRATIKTE YOKTUR - ve bunu ancak link
        # gercekten koptugunda, yani en kotu anda fark ederdiniz.
        #
        # Basligi YALNIZCA KUTU yok sayiyor; cihaza oldugu gibi gidiyor, yani
        # cihaz hala onbelleklemiyor. Istenen tam olarak bu.
        # -------------------------------------------------------------------
        proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;

        proxy_cache_valid 200 1m;
        proxy_cache_use_stale error timeout invalid_header updating
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # Merkez yavassa pencereyi yakmayalim: hizlica bayat kopyaya dusulur
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        # Teshis: cihazin bayat manifest alip almadigi loglardan gorulur
        add_header X-Manifest-Cache $upstream_cache_status always;
    }

    # -----------------------------------------------------------------------
    # DIGER API (log, heartbeat, kanit karesi): duz gecis.
    #
    # Store-and-forward kuyrugu YOK - gerek de yok: cihaz ACK almadan log
    # satirini silmiyor. Merkez erisilemezse otobus loglari kendinde tutar,
    # bir sonraki ziyarette tekrar gonderir. Bir bileseni az tutmak, bir
    # bileseni fazla bakmaktan iyidir.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://merkez;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Cihaz tokeni yukari GECMEK ZORUNDA: merkez tum /api uclarinda
        # kimlik dogruluyor. (nginx Authorization'i varsayilan olarak gecirir;
        # burada acikca yazmak, ileride biri proxy_set_header eklediginde
        # basligin sessizce dusmesini onler.)
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_request_buffering off;
    }

    location = /saglik {
        return 200 "onbellek kutusu calisiyor\n";
        add_header Content-Type text/plain;
    }
}
