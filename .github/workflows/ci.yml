name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Ayni dal icin yeni push gelince eskisini iptal et: CI dakikasi bosa gitmesin
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sunucu:
    name: Sunucu testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bagimliliklar
        working-directory: sunucu
        run: npm ci --no-audit --no-fund
      - name: "Testler (uctan uca, guvenlik ve transcode)"
        working-directory: sunucu
        run: npm test

  android:
    name: Android derleme ve birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android KULLANILMIYOR:
      # varsayilan olarak artik SDK deposunda bulunmayan eski 'tools' paketini
      # kurmaya calisiyor ve "Failed to find package 'tools'" ile dusuyor.
      # ubuntu-latest imajinda Android SDK zaten kurulu; AGP eksik platform ve
      # build-tools'u kendisi indiriyor.
      - name: Android SDK yolunu dogrula
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK bulunamadi"; exit 1; }
          ls "$ANDROID_HOME"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      # Gercek anahtarlar depoda degil; CI derleme icin gecici deger kullanir.
      # (32 baytlik gecerli bicimde bir base64 - imza dogrulamasi CI'da test EDILMEZ,
      #  o dogrulama sunucu testlerinde ve saf Kotlin testlerinde yapiliyor.)
      - name: Birim testleri
        working-directory: android
        run: >
          ./gradlew --no-daemon testDebugUnitTest
          -PMANIFEST_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -PPROVISION_SECRET=ci-test-secret

      # -------------------------------------------------------------------
      # LINT ARTIK BLOKLUYOR (continue-on-error KALDIRILDI).
      #
      # Sebep somut: minSdk 24 ama kodun bazi yerleri daha yeni API'ler cagiriyor
      # (PackageInstaller oturum listesi, dpm.setTime, Settings.Global.BOOT_COUNT).
      # Bunlarin her biri Android 7 bir stick'te NoSuchMethodError ile COKER ve bunu
      # yalnizca SAHADA, cihaz elimizde olmadan ogrenirdik. Lint'in NewApi kurali tam
      # bu sinifi yakalar; "continue-on-error" ise onu gormezden geliyordu - yani
      # elimizdeki tek otomatik koruma kapatilmisti.
      #
      # Ayni gerekce diger lint hatalari icin de gecerli: bu cihazlara uzaktan
      # baglanamiyoruz, dolayisiyla derleme zamaninda yakalanan her sey bedava.
      # -------------------------------------------------------------------
      - name: Lint
        working-directory: android
        run: >
          ./gradlew --no-daemon :app:lintDebug
          -PMANIFEST_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -PPROVISION_SECRET=ci-test-secret

      - name: APK derle (debug)
        working-directory: android
        run: >
          ./gradlew --no-daemon assembleDebug
          -PMANIFEST_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -PPROVISION_SECRET=ci-test-secret

      # -------------------------------------------------------------------
      # RELEASE VARYANTI DA DERLENIYOR.
      #
      # Onceden yalnizca debug derleniyordu, yani minifyEnabled/R8 ve
      # shrinkResources yolu ILK KEZ SAHAYA CIKIS GUNU deneniyordu. R8'in
      # kaldirdigi bir sinif (Room olusturulmus kodu, Media3 yansimasi,
      # Ed25519 kutuphanesi) ancak CIHAZDA, kurulum sirasinda ortaya cikar -
      # ve o anda geri donus yolu da yoktur. CI'da gecici bir anahtarla
      # derlemek bu sinifi tamamen kapatiyor.
      #
      # Anahtar GECICI ve isten sonra yok olur; uretim APK'si bununla
      # imzalanmaz (uretim anahtari depoda degildir).
      - name: Gecici imzalama anahtari uret
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/ci-gecici.jks" -storepass ciparola -keypass ciparola -alias ci -keyalg RSA -keysize 2048 -validity 365 -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=TR"

      # RELEASE_KEYSTORE MUTLAK YOL OLMAK ZORUNDA: build.gradle.kts icindeki
      # file(...) cagrisi :app MODULUNE gore cozumlenir, `android/` dizinine gore
      # degil. Goreli bir ad verildiginde Gradle onu android/app/ altinda arar ve
      # validateSigningRelease "keystore bulunamadi" ile duser. (Bu hatayi tam da
      # bu adim yakaladi - onceden release varyanti hic derlenmiyordu.)
      - name: APK derle (release + R8)
        working-directory: android
        run: >
          ./gradlew --no-daemon assembleRelease
          -PMANIFEST_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -PPROVISION_SECRET=ci-test-secret-uzun-deger
          -PRELEASE_KEYSTORE=${{ runner.temp }}/ci-gecici.jks
          -PRELEASE_KEYSTORE_PASSWORD=ciparola
          -PRELEASE_KEY_ALIAS=ci
          -PRELEASE_KEY_PASSWORD=ciparola

      - name: Release APK GERCEKTEN imzali mi
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          echo "APK: $APK"
          case "$APK" in *unsigned*) echo "HATA: imzasiz APK uretildi"; exit 1;; esac
          test -s "$APK"

      # mapping.txt: saha yigin izlerini cozmenin TEK yolu. Yayinlanan her
      # surum icin saklanmasi gerekir; kaybedilirse o surumden gelen izler
      # bir daha okunamaz.
      - name: R8 mapping dosyasini arsivle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: android/app/build/outputs/mapping/release/
          if-no-files-found: warn

      - name: Test raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/schemas/
          if-no-files-found: ignore

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  betikler:
    name: Kabuk betikleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning tools/*.sh onbellek-kutusu/*.sh
