name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sunucu:
    name: Sunucu testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bagimliliklar
        working-directory: sunucu
        run: npm ci --no-audit --no-fund
      - name: "Testler (24 test - uctan uca ve guvenlik)"
        working-directory: sunucu
        run: npm test

  android:
    name: Android derleme ve birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android KULLANILMIYOR:
      # varsayilan olarak artik SDK deposunda bulunmayan eski 'tools' paketini
      # kurmaya calisiyor ve "Failed to find package 'tools'" ile dusuyor.
      # ubuntu-latest imajinda Android SDK zaten kurulu; AGP eksik platform ve
      # build-tools'u kendisi indiriyor.
      - name: Android SDK yolunu dogrula
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK bulunamadi"; exit 1; }
          ls "$ANDROID_HOME"
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      # Gercek anahtarlar depoda degil; CI derleme icin gecici deger kullanir.
      # (32 baytlik gecerli bicimde bir base64 - imza dogrulamasi CI'da test EDILMEZ,
      #  o dogrulama sunucu testlerinde ve saf Kotlin testlerinde yapiliyor.)
      - name: Birim testleri
        working-directory: android
        run: >
          ./gradlew --no-daemon testDebugUnitTest
          -PMANIFEST_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -PPROVISION_SECRET=ci-test-secret

      - name: Lint
        working-directory: android
        run: >
          ./gradlew --no-daemon :app:lintDebug
          -PMANIFEST_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -PPROVISION_SECRET=ci-test-secret
        continue-on-error: true

      - name: APK derle (debug)
        working-directory: android
        run: >
          ./gradlew --no-daemon assembleDebug
          -PMANIFEST_PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -PPROVISION_SECRET=ci-test-secret

      - name: Test raporlarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  betikler:
    name: Kabuk betikleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning tools/*.sh onbellek-kutusu/*.sh
