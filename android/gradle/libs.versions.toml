# Surumler burada tek noktadan yonetilir.
# Bu kombinasyon birbiriyle uyumludur; birini yukseltirken digerlerini kontrol edin.
[versions]
agp = "8.5.2"
kotlin = "1.9.24"
ksp = "1.9.24-1.0.20"
coroutines = "1.8.1"
room = "2.6.1"
media3 = "1.4.1"
okhttp = "4.12.0"
work = "2.9.1"
lifecycle = "2.8.4"
coreKtx = "1.13.1"
appcompat = "1.7.0"
eddsa = "0.3.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx        = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat       = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-work            = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

room-runtime             = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                 = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler            = { module = "androidx.room:room-compiler", version.ref = "room" }

media3-exoplayer         = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui                = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-common            = { module = "androidx.media3:media3-common", version.ref = "media3" }

okhttp                   = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coroutines-android       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Ed25519: tum API seviyelerinde ayni sekilde calisir.
# java.security "Ed25519" saglayicisi sadece API 33+ te var; bu kutuphane API 24'te de calisir.
eddsa                    = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }

junit                    = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
