org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Manifest imzalama ACIK anahtari (ham 32 bayt, base64).
# Sunucuda `npm run anahtar-uret` calistirildiginda ekrana basilir.
# Bu deger yanlissa cihaz HICBIR manifesti kabul etmez - bu kasitli bir guvenlik
# davranisidir: onbellek kutusu ele gecse bile cihaza sahte reklam yollanamaz.
# ---------------------------------------------------------------------------
MANIFEST_PUBLIC_KEY=BURAYA_ACIK_ANAHTARI_YAPISTIRIN

# Provizyon yayinlarini korumak icin paylasilan sir.
# Cihaz sadece HENUZ PROVIZYONLANMAMISKEN ve bu sir dogruyken provizyonu kabul eder.
PROVISION_SECRET=degistir-beni-uzun-rastgele-bir-dize

# ---------------------------------------------------------------------------
# Release imzalama (ZORUNLU - imzasiz APK cihaza kurulamaz).
# Bu satirlari kendi degerlerinizle acin. Anahtar dosyasi ve parolalar
# DEPOYA GIRMEZ; .gitignore *.jks ve *.keystore dosyalarini disliyor.
#
# TUM surumler AYNI anahtarla imzalanmali, yoksa sessiz guncelleme reddedilir.
# Anahtari kaybederseniz 50 otobuse elle gitmek gerekir - YEDEKLEYIN.
# ---------------------------------------------------------------------------
# RELEASE_KEYSTORE=/guvenli/yol/reklam.jks
# RELEASE_KEYSTORE_PASSWORD=
# RELEASE_KEY_ALIAS=reklam
# RELEASE_KEY_PASSWORD=
