org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ===========================================================================
# BU DOSYA DEPODA TAKIP EDILIYOR - ICINE GERCEK SIR YAZMAYIN.
#
# Asagidakiler SABLON. Gercek degerleri KULLANICI SEVIYESINDEKI dosyaya yazin:
#
#     ~/.gradle/gradle.properties        (Windows: %USERPROFILE%\.gradle\gradle.properties)
#
# Gradle iki dosyayi birlestirir ve kullanici seviyesindeki deger bunu EZER, yani
# derleme aynen calisir - ama sir depo gecmisine HIC girmez. Buraya yazilan bir
# ADMIN/PROVISION sirri veya keystore parolasi ilk `git add -A` ile depoya duser ve
# gecmisten silinmesi ayri bir operasyon gerektirir.
#
# Ornek (~/.gradle/gradle.properties):
#     MANIFEST_PUBLIC_KEY=<npm run anahtar-uret ciktisi>
#     PROVISION_SECRET=<uzun rastgele dize>
#     RELEASE_KEYSTORE=/guvenli/yol/reklam.jks
#     RELEASE_KEYSTORE_PASSWORD=...
#     RELEASE_KEY_ALIAS=reklam
#     RELEASE_KEY_PASSWORD=...
#
# CI icin -P... bayraklariyla komut satirindan gecin (bkz. .github/workflows/ci.yml).
# ===========================================================================

# ---------------------------------------------------------------------------
# Manifest imzalama ACIK anahtari (ham 32 bayt, base64).
# Sunucuda `npm run anahtar-uret` calistirildiginda ekrana basilir.
# Bu deger yanlissa cihaz HICBIR manifesti kabul etmez - bu kasitli bir guvenlik
# davranisidir: onbellek kutusu ele gecse bile cihaza sahte reklam yollanamaz.
# ---------------------------------------------------------------------------
MANIFEST_PUBLIC_KEY=BURAYA_ACIK_ANAHTARI_YAPISTIRIN

# Provizyon yayinlarini korumak icin paylasilan sir.
# Cihaz sadece HENUZ PROVIZYONLANMAMISKEN ve bu sir dogruyken provizyonu kabul eder.
PROVISION_SECRET=degistir-beni-uzun-rastgele-bir-dize

# ---------------------------------------------------------------------------
# Release imzalama (ZORUNLU - imzasiz APK cihaza kurulamaz).
# Degerleri ~/.gradle/gradle.properties icine yazin (yukaridaki nota bakin).
# Anahtar DOSYASI da depoya girmez; .gitignore *.jks ve *.keystore disliyor.
#
# TUM surumler AYNI anahtarla imzalanmali, yoksa sessiz guncelleme reddedilir.
# Anahtari kaybederseniz 50 otobuse elle gitmek gerekir - YEDEKLEYIN.
# ---------------------------------------------------------------------------
# RELEASE_KEYSTORE=/guvenli/yol/reklam.jks
# RELEASE_KEYSTORE_PASSWORD=
# RELEASE_KEY_ALIAS=reklam
# RELEASE_KEY_PASSWORD=
